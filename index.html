<title>MBG</title>
<style>
/* Aplikasi laporan usaha pribadi. Semua angka dan identitas usaha datang dari database setelah masuk dengan sandi;
   kode ini sengaja tidak memuat nama usaha, alamat, rekening, atau nama pelanggan. */
:root{
  --bg:#07100d; --bg2:#0b1712; --panel:#0f1d17; --panel2:#132620; --garis:rgba(190,230,205,.09); --garis2:rgba(190,230,205,.16);
  --teks:#edf3ef; --redup:#98aba1; --samar:#63766c;
  --hijau:#5fd08f; --hijau2:#3fa76b; --hijau-bg:rgba(95,208,143,.12);
  --kunyit:#e8b54a; --kunyit-bg:rgba(232,181,74,.13); --merah:#f0826f; --merah-bg:rgba(240,130,111,.13); --biru:#7fb4ea;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:22px; --r2:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.55 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh;
  background-image:radial-gradient(900px 480px at 50% -120px,rgba(95,208,143,.13),transparent 70%),radial-gradient(600px 400px at 100% 30%,rgba(232,181,74,.05),transparent 70%);background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--hijau);outline-offset:2px;border-radius:8px}
.bungkus{max-width:1120px;margin:0 auto;padding:0 18px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.miring{font-family:var(--serif);font-style:italic;font-weight:400}
.mono{font-family:var(--mono);font-size:.86em}
.redup{color:var(--redup)} .samar{color:var(--samar)} .hijau{color:var(--hijau)} .kunyit{color:var(--kunyit)} .merah{color:var(--merah)}
.label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--redup);font-weight:600}

/* kepala */
.kepala{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,16,13,.72);border-bottom:1px solid var(--garis)}
.kepala .bungkus{display:flex;align-items:center;gap:14px;height:64px;padding-top:env(safe-area-inset-top)}
.merek{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.merek img{width:34px;height:34px;border-radius:50%}
.merek b{font-size:17px;letter-spacing:-.01em}
.merek small{display:block;font-size:11px;color:var(--redup);margin-top:-3px;white-space:nowrap}
.pil-hijau{text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--hijau);background:var(--hijau-bg);border:1px solid rgba(95,208,143,.25);padding:3px 10px;border-radius:99px;white-space:nowrap}
.titik{width:7px;height:7px;border-radius:50%;background:var(--hijau);box-shadow:0 0 0 3px rgba(95,208,143,.2)}
.menu-atas{display:flex;gap:4px;margin-left:auto}
.menu-atas a{padding:8px 11px;border-radius:99px;text-decoration:none;color:var(--redup);font-size:13.5px;font-weight:500}
.menu-atas a:hover{color:var(--teks)}
.menu-atas a.aktif{color:var(--teks);background:rgba(255,255,255,.06)}
.kanan-kepala{display:flex;align-items:center;gap:8px;margin-left:12px}
.tombol-ikon{width:36px;height:36px;border-radius:50%;border:1px solid var(--garis2);background:transparent;display:grid;place-items:center;color:var(--redup)}
.tombol-ikon:hover{color:var(--teks)}

/* menu bawah (HP) */
.menu-bawah{display:none}
@media (max-width:1060px){ .kanan-kepala .pil-hijau{display:none} }
@media (max-width:860px){
  .menu-atas{display:none}
  .kanan-kepala .pil-hijau{display:inline-flex}
  .menu-bawah{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:rgba(15,29,23,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--garis2);border-radius:24px;padding:6px;justify-content:space-between;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .menu-bawah a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:18px;text-decoration:none;color:var(--samar);font-size:10.5px;font-weight:600}
  .menu-bawah a.aktif{color:var(--hijau);background:var(--hijau-bg)}
  main{padding-bottom:110px}
  html{scroll-padding-bottom:110px}   /* tombol & kolom isian yang digulir otomatis berhenti di atas bilah menu */
  .aksi-lekat{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;padding:8px;margin:14px -8px 0;border-radius:22px;background:rgba(7,16,13,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .aksi-lekat::-webkit-scrollbar{display:none}
  .aksi-lekat .tombol{flex:none;padding:10px 14px;font-size:13.5px}
}

/* umum */
main{padding-top:26px;padding-bottom:60px}
.bagian{margin-top:34px}
.bagian > h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.bagian > p.ket{margin:0 0 16px;color:var(--redup);max-width:62ch}
.kartu{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--garis);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}   /* isi grid tidak boleh melebarkan kolom; tabel lebar menggulir di dalam kartunya */
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .g2,.g3{grid-template-columns:1fr} .bagian > h2{font-size:26px} }
.pil{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--redup);white-space:nowrap}
.pil.hijau{background:var(--hijau-bg);color:var(--hijau)} .pil.kunyit{background:var(--kunyit-bg);color:var(--kunyit)} .pil.merah{background:var(--merah-bg);color:var(--merah)}
.pil-baris{display:flex;flex-wrap:wrap;gap:8px}
.tab-baris{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab-baris::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--garis2);background:transparent;border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--redup);white-space:nowrap}
.tab.aktif{background:var(--teks);color:#0a1511;border-color:var(--teks)}
.tbl-bungkus{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--samar);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--garis2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--garis);vertical-align:top}
tr:last-child td{border-bottom:0}
.angka{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--garis2)}
.kosong{padding:26px;text-align:center;color:var(--redup)}

/* pahlawan */
.pahlawan{padding:30px 0 6px;text-align:center}
.pahlawan .pil-hijau{font-size:12px;padding:5px 13px}
.pahlawan h1{font-family:var(--sans);font-weight:700;font-size:clamp(40px,8vw,76px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 6px}
.pahlawan h1 .miring{font-weight:400;letter-spacing:-.01em}
.pahlawan .sub{color:var(--redup);font-size:16px;max-width:560px;margin:0 auto}
.pahlawan .aksi{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.tombol{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:12px 20px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--garis2);background:rgba(255,255,255,.03)}
.tombol.utama{background:var(--hijau);color:#06140d;border-color:var(--hijau);box-shadow:0 8px 30px rgba(95,208,143,.25)}
.tombol:hover{filter:brightness(1.07)}
.fitur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.fitur > div{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r2);background:rgba(255,255,255,.025);border:1px solid var(--garis)}
.fitur .ik{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hijau-bg);color:var(--hijau)}
.fitur b{display:block;font-size:14.5px;line-height:1.25}
.fitur small{color:var(--redup);font-size:12px}
@media (max-width:860px){ .fitur{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ubin angka */
.ubin .nilai{font-family:var(--serif);font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.ubin .nilai.kecil{font-size:26px}
.ubin small{color:var(--redup);font-size:12.5px}

/* laporan laba rugi bertingkat */
.lr{display:flex;flex-direction:column}
.lr .b{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--garis2)}
.lr .b:last-child{border-bottom:0}
.lr .b.kurang span:first-child{padding-left:14px;color:var(--redup)}
.lr .b.jumlah{border-bottom:1px solid var(--garis2)}
.lr .b.jumlah span:first-child{font-weight:700}
.lr .b.besar{padding:14px 0}
.lr .b.besar span:last-child{font-family:var(--serif);font-size:30px;line-height:1}
.lr small{color:var(--samar);font-size:12px;margin-left:6px}

/* grafik */
.grafik svg{width:100%;height:auto;display:block}
.grafik text{fill:var(--samar);font:12px var(--sans)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--redup);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* baris daftar */
.daftar > div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--garis);align-items:center}
.daftar > div:last-child{border-bottom:0}
.daftar b{font-weight:600}
.batang{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
.batang i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hijau2),var(--hijau))}

.catatan-ai{position:relative;padding:20px 22px;border-radius:var(--r);background:linear-gradient(135deg,rgba(95,208,143,.10),rgba(95,208,143,.02) 60%);border:1px solid rgba(95,208,143,.2)}
.catatan-ai p{margin:8px 0 0;font-size:15.5px;line-height:1.65}

/* masuk */
.masuk{min-height:100vh;display:grid;place-items:center;padding:30px 18px}
.masuk .kotak{width:100%;max-width:420px;text-align:center}
.masuk img{width:64px;height:64px;border-radius:50%}
.masuk h1{font-family:var(--sans);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.05;margin:18px 0 8px}
.masuk p{color:var(--redup);margin:0 0 24px}
.masuk form{display:flex;flex-direction:column;gap:10px;text-align:left}
.masuk input{width:100%;padding:14px 18px;border-radius:99px;border:1px solid var(--garis2);background:rgba(255,255,255,.04);color:var(--teks);font:inherit;font-size:16px}
.masuk input:focus{outline:none;border-color:var(--hijau)}
.masuk .tombol{justify-content:center;width:100%;font-size:15.5px}
.pesan-salah{color:var(--merah);font-size:13.5px;min-height:20px;text-align:center}
.kaki{margin-top:46px;padding:18px 0;border-top:1px solid var(--garis);color:var(--samar);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.memuat{padding:80px 0;text-align:center;color:var(--redup)}
/* formulir */
.isian{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--redup);font-weight:600}
.isian input,.isian select,.isian textarea,.sel input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--garis2);background:rgba(255,255,255,.04);color:var(--teks);font:inherit;font-size:14.5px;font-weight:500}
.isian select option{background:#0f1d17}
.isian input:focus,.isian select:focus,.sel input:focus{outline:none;border-color:var(--hijau)}
.sel input{padding:8px 9px;border-radius:9px;font-size:14px}
.sel input.angka{text-align:right}
table.ed td{padding:5px 4px;border-bottom:1px solid var(--garis)} table.ed th{padding:6px 4px}
.tombol.kecil{padding:8px 14px;font-size:13px}
.tombol.bahaya{color:var(--merah);border-color:rgba(240,130,111,.35)}
.baris-aksi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lembar{background:#fff;color:#111;border-radius:14px;padding:26px 28px;font:13px/1.45 'Plus Jakarta Sans',Arial,sans-serif;font-variant-numeric:tabular-nums;overflow-x:auto}
.lembar .kop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:10px}
.lembar .kop b{font-size:17px;letter-spacing:.01em}
.lembar h3{font-size:15px;letter-spacing:.14em;margin:14px 0 8px;font-weight:700}
.lembar table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.lembar th,.lembar td{border:1px solid #333;padding:5px 7px;color:#111}
.lembar th{background:#eef3ef;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.lembar .kanan{text-align:right;white-space:nowrap}
.lembar .ttd{display:flex;justify-content:space-between;margin-top:26px;text-align:center}
.lembar .ttd div{min-width:180px}
.lembar .ttd .garis-ttd{margin-top:54px;border-top:1px dotted #333;padding-top:4px}
.lembar .kecil{font-size:11.5px;color:#444}
/* lembar pemberitahuan fee mitra: sengaja berbeda dari nota dapur (pita kop gelap, kotak info, total di kotak kuning) */
.lembar .mitra-kop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;background:#0d2419;color:#f1e7cf;border-radius:12px;padding:16px 18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra-kop .jenis{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8fd9ae;font-weight:700}
.lembar .mitra-kop b{display:block;font-size:21px;color:#fff;margin-top:3px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:0}
.lembar .mitra-kop .kanan-kop{text-align:right;font-size:12px;color:#cfe3d6}
.lembar .mitra-kop .kanan-kop strong{display:block;font-size:14px;color:#fff;letter-spacing:.04em}
.lembar .mitra-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.lembar .mitra-info div{border:1px solid #d9e2dc;border-radius:10px;padding:9px 11px}
.lembar .mitra-info span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b7a71;margin-bottom:2px}
.lembar .mitra table th{background:#f6efdc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra table td,.lembar .mitra table th{border-color:#cdd6d0}
.lembar .mitra-total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;background:#fbf3e0;border:1px solid #e8b54a;border-radius:12px;padding:12px 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra-total b{font-size:23px;white-space:nowrap}
.lembar tr.hari-nota td{background:#f1f4f2;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5a6b61;margin:16px 0 6px}
.lembar .mitra tr.hari td{background:#eef5f0;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra tr.sub td{font-weight:700;border-top:1.5px solid #9fb3a7}
.lembar .mitra tr,.lembar .mitra .mitra-total{break-inside:avoid;page-break-inside:avoid}
.lembar .batang-hari{display:inline-block;height:8px;border-radius:99px;background:#5fd08f;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .tanda-top{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:#8a6a1f;background:#fbf3e0;border:1px solid #e8b54a;border-radius:99px;padding:1px 7px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hari-daftar > div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--garis);font-size:13.5px}
.hari-daftar > div:last-child{border-bottom:0}
.lembar .mitra-catatan{font-size:11.5px;color:#555;margin-top:10px;border-left:3px solid #5fd08f;padding-left:10px}
@media screen and (max-width:560px){ .lembar .mitra-info{grid-template-columns:1fr} .lembar .mitra-kop .kanan-kop{text-align:left} }
/* Cetak: hanya lembar #cetak yang tampil, bagian lain dibuang dari tata letak (bukan disembunyikan) supaya
   tidak ada halaman kosong. Lembar fee disimpan di luar layar, jadi tidak perlu dimunculkan-disembunyikan saat mencetak
   (Chrome Android mencetak tidak menunggu, lembar yang disembunyikan lagi terlalu cepat bisa tercetak kosong). */
@media screen{ .luar-layar{position:absolute!important;left:-10000px;top:0;width:820px} }
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;background-image:none!important}
  .kepala,.menu-bawah,.kaki,#pesanSingkat{display:none!important}
  main{padding:0!important;max-width:none!important}
  #isi > :not(:has(#cetak)):not(#cetak){display:none!important}
  #isi > :has(#cetak) > :not(#cetak){display:none!important}
  #isi > :has(#cetak){margin:0!important;padding:0!important}
  #cetak{display:block!important;position:static!important;margin:0!important;padding:0!important;border-radius:0;width:auto;overflow:visible!important}
  #cetak table{min-width:0!important}
  .lembar .mitra-info{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media (prefers-reduced-motion:no-preference){ .muncul{animation:muncul .45s ease both} @keyframes muncul{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}} }
</style>

  if (a >= 1e3) return t + 'Rp ' + Math.round(a / 1e3).toLocaleString('id-ID') + ' rb';
  return t + 'Rp ' + Math.round(a); };

const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

const tgl = (t, thn) => { const d = tglD(t); return d ? `${d.getDate()} ${BLN[d.getMonth()]}${thn ? ' ' + d.getFullYear() : ''}` : '-'; };

const kapan = iso => { if (!iso) return '-'; const d = new Date(iso);
  return d.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).replace('pukul ', '').replace(/\./g, ':').replace(/:(\d\d)$/, '.$1'); };
const judulOutlet = o => String(o || '').replace(/^MBG\s+/i, '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\bTpi\b/, 'TPI').replace(/\bPnk\b/, 'PNK').replace(/\bSpo\b/, 'SPO');

const sesi = {

  simpan(s) { try { localStorage.setItem('mbg-sesi', JSON.stringify(s)); } catch {} },
  hapus() { try { localStorage.removeItem('mbg-sesi'); } catch {} },

async function rpc(fn, args) {
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: ANON, Authorization: `Bearer ${ANON}`, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error('Tidak tersambung ke server (' + r.status + '). Periksa internet lalu coba lagi.');
  return r.json();
}
let D = null, CATATAN = null, PEMBARUAN = null, TARIF = {}, INVOICE = [];
async function muat() {
  const s = sesi.baca(); if (!s) return layarMasuk();
  const ambil = k => rpc('mbg_ambil_nilai', { p_token: s.token, p_kunci: k });
  const [a, b, c, t, inv] = await Promise.all([ambil('data'), ambil('catatan'), ambil('pembaruan'), ambil('tarif-fee'), rpc('mbg_invoice_daftar', { p_token: s.token })]);
  if (!a.ok) { sesi.hapus(); return layarMasuk(a.pesan); }
  D = a.nilai; CATATAN = b.ok ? b.nilai : null; PEMBARUAN = c.ok ? c.nilai : null;

  siapkan(); tampil();
}

// ---------- olahan data
let M = [], OUT = {}, BULAN = [];
function siapkan() {
  const pr = D.profil || {}; OUTLET_FEE = pr.outletFee || []; PENERBIT = { nama: pr.usaha || '', alamat: pr.alamat || '' };
  M = D.mingguan || [];
  // outlet: gabungan omzet harian (patokan, sejak Mei) dan laporan mingguan (laba)
  OUT = {};
  for (const x of D.omzetHarian || []) { const o = OUT[x.outlet] ||= { nama: x.outlet, harian: [], minggu: [] }; o.harian.push(x); }
  for (const w of M) for (const o of w.outlet) { const q = OUT[o.outlet] ||= { nama: o.outlet, harian: [], minggu: [] }; q.minggu.push({ ...o, minggu: w.minggu, awal: w.awal, akhir: w.akhir }); }
  for (const o of Object.values(OUT)) {
    o.total = o.harian.reduce((a, x) => a + x.omzet, 0); o.terakhir = o.harian.map(x => x.tanggal).sort().pop() || (o.minggu.at(-1) || {}).akhir;
    o.laba = o.minggu.reduce((a, x) => a + x.labaKotor, 0); o.omzetLap = o.minggu.reduce((a, x) => a + x.omzet, 0); o.fee = OUTLET_FEE.includes(o.nama);
  }
  // laba rugi per bulan (minggu dimasukkan ke bulan tanggal awalnya)
  const per = {};
  for (const w of M) { const k = (w.awal || '').slice(0, 7); if (!k) continue; const b = per[k] ||= { bulan: k, minggu: [], omzet: 0, modal: 0, fee: 0, pengeluaran: 0, labaKotor: 0, biayaOps: 0, nonOps: 0, labaBersih: 0 };
    b.minggu.push(w.minggu); for (const f of ['omzet', 'modal', 'fee', 'pengeluaran', 'labaKotor', 'biayaOps', 'nonOps', 'labaBersih']) b[f] += w.total[f] || 0; }
  BULAN = Object.values(per).sort((a, b) => a.bulan.localeCompare(b.bulan));
}

// ---------- grafik batang sederhana (satu skala untuk batang, garis bantu, dan label)
function grafikBatang(data, { tinggi = 210, seri = [{ k: 'v', warna: 'var(--hijau)' }], label = d => d.label, format = rpS } = {}) {
  if (!data.length) return '<div class="kosong">Belum ada data.</div>';
  const W = 640, kiri = 58, bawah = 26, atas = 12, H = tinggi;
  const maks = Math.max(1, ...data.flatMap(d => seri.map(s => d[s.k] || 0)));
  const langkah = (() => { const kasar = maks / 4, p = 10 ** Math.floor(Math.log10(kasar)), n = kasar / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const puncak = Math.ceil(maks / langkah) * langkah, y = v => atas + (H - atas - bawah) * (1 - v / puncak);
  const lebarGrup = (W - kiri - 8) / data.length, lb = Math.min(26, (lebarGrup - 12) / seri.length);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= puncak + 1; v += langkah) s += `<line x1="${kiri}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(190,230,205,.08)"/><text x="${kiri - 8}" y="${y(v) + 4}" text-anchor="end">${esc(format(v).replace('Rp ', ''))}</text>`;
  data.forEach((d, i) => {
    const x0 = kiri + i * lebarGrup + (lebarGrup - lb * seri.length - 4 * (seri.length - 1)) / 2;
    seri.forEach((sr, j) => { const v = Math.max(0, d[sr.k] || 0), yy = y(v); s += `<rect x="${x0 + j * (lb + 4)}" y="${yy}" width="${lb}" height="${Math.max(0, H - bawah - yy)}" rx="5" fill="${sr.warna}"><title>${esc(label(d))}: ${esc(rp(d[sr.k]))}</title></rect>`; });
    s += `${data.length <= 16 || i % 2 === 0 ? `<text x="${kiri + i * lebarGrup + lebarGrup / 2}" y="${H - 8}" text-anchor="middle">${esc(label(d))}</text>` : ''}`;
  });
  return `<div class="grafik" style="overflow-x:auto">${s}</svg></div>`;
}

    const kh = kunciB(r.barang) + '|' + r.fee + '|' + kunciB(r.satuan); const bh = hr.barang[kh] ||= { barang: r.barang, satuan: r.satuan, fee: r.fee, qty: 0 };
    bh.qty += r.qty; hr.fee += r.qty * r.fee; hr.nota.add(String(r.nota || '').replace(/^NOTA\s*/i, ''));
    const k = kunciB(r.barang) + '|' + r.fee + '|' + kunciB(r.satuan); const b = o.barang[k] ||= { barang: r.barang, satuan: r.satuan, fee: r.fee, qty: 0 };

    ['Periode', `${tgl(dari, true)} s.d. ${tgl(sampai, true)}`, `${H.length} hari pengantaran`], [], ['RINGKASAN PER HARI'], ['NO', 'Hari', 'Tanggal', 'Nota', '', 'Fee hari itu'],
    ...H.map((h, i) => [i + 1, hariNama(h.tanggal) + (h.top ? ' (terbanyak)' : ''), tgl(h.tanggal, true), [...h.nota].filter(Boolean).join(', '), '', h.fee]), ['', '', '', '', 'TOTAL', o.total], [],
    ['RINCIAN BARANG PER HARI'], ['Barang', 'Banyaknya', 'Satuan', 'Fee per satuan', 'Jumlah fee']];
  for (const h of H) { aoa.push([labelHari(h.tanggal)]); for (const b of Object.values(h.barang)) aoa.push([b.barang, b.qty, b.satuan, b.fee, b.qty * b.fee]); aoa.push(['', '', '', 'Subtotal', h.fee]); }
  aoa.push([], ['', '', '', 'TOTAL FEE', o.total], ['Terbilang: ' + terbilang(o.total)]);
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{ wch: 30 }, { wch: 22 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 16 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'FEE MITRA');
  XLSX.writeFile(wb, ext.berkas || `FEE MITRA ${judulOutlet(o.outlet).toUpperCase()} ${dari} sd ${sampai}.xlsx`);
}
function vFee(el) { return vTarifFee(el); }
// Tarif fee: fee per satuan tiap barang per dapur. Awalnya dari laporan terakhir; yang diubah di sini dipakai invoice berikutnya.
function vTarifFee(el) {
  const riwayat = {};
  for (const w of M) for (const r of w.rincian) if (OUTLET_FEE.includes(r.o)) { const k = kunciB(r.b); (riwayat[r.o] ||= {})[k] = { barang: r.b, satuan: r.s, fee: r.f, tanggal: r.t }; }
  const ubah = JSON.parse(JSON.stringify(TARIF || {}));
  el.innerHTML = `
  <section class="bagian" style="margin-top:6px">
    <a href="#invoice" class="pil" style="text-decoration:none">← Invoice</a>
    <h2 style="margin-top:14px">Tarif <span class="miring">fee</span></h2>
    <p class="ket">Fee per satuan tiap barang untuk ${esc(daftarFee())}. Di invoice, tarif ini tampil sebagai petunjuk di kolom fee dan bisa diisikan sekaligus lewat tombol Pakai tarif fee. Angka awal diambil dari laporan mingguan terakhir. Laporan mingguan di Excel tetap memakai ketikanmu sendiri.</p>
    <div class="grid g2">${OUTLET_FEE.map(o => { const R = Object.entries(riwayat[o] || {}).sort((a, b) => a[1].barang.localeCompare(b[1].barang));
      return `<div class="kartu"><b style="font-size:17px">${esc(judulOutlet(o))}</b><div class="samar" style="font-size:12px">${R.length} barang pernah dikirim</div>
        <div class="tbl-bungkus" style="margin-top:8px;max-height:460px;overflow-y:auto"><table class="ed"><thead><tr><th>Barang</th><th>Satuan</th><th class="angka">Fee/sat</th></tr></thead>
        <tbody>${R.map(([k, x]) => { const t = (ubah[o] || {})[k]; return `<tr><td>${esc(x.barang)}</td><td class="redup">${esc(x.satuan)}</td><td class="sel"><input type="number" class="angka" step="any" inputmode="decimal" data-o="${esc(o)}" data-k="${esc(k)}" value="${esc(t ?? x.fee ?? 0)}" style="width:100px"></td></tr>`; }).join('') || '<tr><td colspan="3" class="kosong">Belum ada riwayat.</td></tr>'}</tbody></table></div></div>`; }).join('')}</div>
    <div class="baris-aksi aksi-lekat" style="margin-top:14px"><button class="tombol utama" id="bSimpanTarif">Simpan tarif</button></div>
  </section>`;
  $$('input[data-o]', el).forEach(i => i.oninput = () => { (ubah[i.dataset.o] ||= {})[i.dataset.k] = +i.value || 0; });
  $('#bSimpanTarif', el).onclick = async () => { try { const r = await rpc('mbg_simpan_nilai', { p_token: sesi.baca().token, p_kunci: 'tarif-fee', p_nilai: ubah });
    if (!r.ok) return pesan(r.pesan || 'Gagal menyimpan.', true); TARIF = ubah; pesan('Tarif fee tersimpan'); } catch (er) { pesan(er.message, true); } };
}

// ---------- MASUK
function layarMasuk(pesan) {
  // Sengaja tanpa nama usaha atau keterangan: siapa pun yang membuka alamat ini hanya melihat kotak sandi.
  document.title = 'MBG';
  akar.innerHTML = `<div class="masuk"><div class="kotak muncul">
    <img src="ikon-any-192.png?v=1" alt="">
    <h1>Masuk</h1>
    <p>Aplikasi pribadi.</p>
    <form id="fMasuk"><input id="iSandi" type="password" autocomplete="current-password" placeholder="Sandi" aria-label="Sandi" required>
      <button class="tombol utama" type="submit">Masuk ${ik('panah', 16)}</button>
      <div class="pesan-salah" id="pSalah">${esc(pesan || '')}</div></form>
  </div></div>`;
  $('#fMasuk').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true; $('#pSalah').textContent = '';
    try { const r = await rpc('mbg_masuk', { p_sandi: $('#iSandi').value });
      if (!r.ok) { $('#pSalah').textContent = r.pesan || 'Sandi salah.'; b.disabled = false; return; }
      sesi.simpan({ token: r.token, masuk: new Date().toISOString() }); akar.innerHTML = '<div class="memuat">Memuat…</div>'; await muat();
    } catch (er) { $('#pSalah').textContent = er.message; b.disabled = false; }
  };
  setTimeout(() => { const i = $('#iSandi'); if (i) i.focus(); }, 60);
}

muat().catch(e => { akar.innerHTML = `<div class="masuk"><div class="kotak"><h1>Belum tersambung</h1><p>${esc(e.message)}</p><button class="tombol utama" onclick="location.reload()">Coba lagi</button></div></div>`; });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
