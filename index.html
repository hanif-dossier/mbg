<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-any-192.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="ikon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<title>NTA</title>
<style>
/* Aplikasi laporan usaha pribadi. Semua angka dan identitas usaha datang dari database setelah masuk dengan sandi;
   kode ini sengaja tidak memuat nama usaha, alamat, rekening, atau nama pelanggan. */
:root{
  --bg:#07100d; --bg2:#0b1712; --panel:#0f1d17; --panel2:#132620; --garis:rgba(190,230,205,.09); --garis2:rgba(190,230,205,.16);
  --teks:#edf3ef; --redup:#98aba1; --samar:#63766c;
  --hijau:#5fd08f; --hijau2:#3fa76b; --hijau-bg:rgba(95,208,143,.12);
  --kunyit:#e8b54a; --kunyit-bg:rgba(232,181,74,.13); --merah:#f0826f; --merah-bg:rgba(240,130,111,.13); --biru:#7fb4ea;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:22px; --r2:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.55 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh;
  background-image:radial-gradient(900px 480px at 50% -120px,rgba(95,208,143,.13),transparent 70%),radial-gradient(600px 400px at 100% 30%,rgba(232,181,74,.05),transparent 70%);background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--hijau);outline-offset:2px;border-radius:8px}
.bungkus{max-width:1120px;margin:0 auto;padding:0 18px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.miring{font-family:var(--serif);font-style:italic;font-weight:400}
.mono{font-family:var(--mono);font-size:.86em}
.redup{color:var(--redup)} .samar{color:var(--samar)} .hijau{color:var(--hijau)} .kunyit{color:var(--kunyit)} .merah{color:var(--merah)}
.label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--redup);font-weight:600}

/* kepala */
.kepala{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,16,13,.72);border-bottom:1px solid var(--garis)}
.kepala .bungkus{display:flex;align-items:center;gap:14px;height:64px;padding-top:env(safe-area-inset-top)}
.merek{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.merek img{width:34px;height:34px;border-radius:50%}
.merek b{font-size:17px;letter-spacing:-.01em}
.merek small{display:block;font-size:11px;color:var(--redup);margin-top:-3px;white-space:nowrap}
.pil-hijau{text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--hijau);background:var(--hijau-bg);border:1px solid rgba(95,208,143,.25);padding:3px 10px;border-radius:99px;white-space:nowrap}
.titik{width:7px;height:7px;border-radius:50%;background:var(--hijau);box-shadow:0 0 0 3px rgba(95,208,143,.2)}
.menu-atas{display:flex;gap:4px;margin-left:auto}
.menu-atas a{padding:8px 11px;border-radius:99px;text-decoration:none;color:var(--redup);font-size:13.5px;font-weight:500}
.menu-atas a:hover{color:var(--teks)}
.menu-atas a.aktif{color:var(--teks);background:rgba(255,255,255,.06)}
.kanan-kepala{display:flex;align-items:center;gap:8px;margin-left:12px}
.tombol-ikon{width:36px;height:36px;border-radius:50%;border:1px solid var(--garis2);background:transparent;display:grid;place-items:center;color:var(--redup)}
.tombol-ikon:hover{color:var(--teks)}

/* menu bawah (HP) */
.menu-bawah{display:none}
@media (max-width:1060px){ .kanan-kepala .pil-hijau{display:none} }
@media (max-width:860px){
  .menu-atas{display:none}
  .kanan-kepala .pil-hijau{display:inline-flex}
  .menu-bawah{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:rgba(15,29,23,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--garis2);border-radius:24px;padding:6px;justify-content:space-between;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .menu-bawah a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:18px;text-decoration:none;color:var(--samar);font-size:10.5px;font-weight:600}
  .menu-bawah a.aktif{color:var(--hijau);background:var(--hijau-bg)}
  main.bungkus{padding-bottom:110px}
  html{scroll-padding-bottom:110px}   /* tombol & kolom isian yang digulir otomatis berhenti di atas bilah menu */
  .aksi-lekat{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;padding:8px;margin:14px -8px 0;border-radius:22px;background:rgba(7,16,13,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .aksi-lekat::-webkit-scrollbar{display:none}
  .aksi-lekat .tombol{flex:none;padding:10px 14px;font-size:13.5px}
}

/* umum */
main{padding-top:26px;padding-bottom:60px}
.bagian{margin-top:34px}
.bagian > h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.bagian > p.ket{margin:0 0 16px;color:var(--redup);max-width:62ch}
.kartu{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--garis);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}   /* isi grid tidak boleh melebarkan kolom; tabel lebar menggulir di dalam kartunya */
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .g2,.g3{grid-template-columns:1fr} .bagian > h2{font-size:26px} }
.fee-saklar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:14px;border:1px dashed var(--garis2);margin-top:-2px}
.fee-saklar.nyala{border-style:solid;border-color:var(--kunyit)}.fee-saklar .fee-status{color:var(--redup)}.fee-saklar.nyala .fee-status{color:var(--kunyit)}
.pil{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--redup);white-space:nowrap}
.pil.hijau{background:var(--hijau-bg);color:var(--hijau)} .pil.kunyit{background:var(--kunyit-bg);color:var(--kunyit)} .pil.merah{background:var(--merah-bg);color:var(--merah)}
.pil-baris{display:flex;flex-wrap:wrap;gap:8px}
.tirai-dialog{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}.tirai-dialog .dialog{width:min(520px,100%);max-height:85vh;overflow:auto}@media (min-width:640px){.tirai-dialog{align-items:center}}
.saring .pil{cursor:pointer;border:1px solid transparent;font:inherit;font-size:12px;font-weight:600}.saring .pil.aktif{border-color:var(--hijau);color:var(--hijau);background:var(--hijau-bg)}.saring .pil .samar{font-weight:600}.saring input{padding:9px 13px;border-radius:12px;border:1px solid var(--garis2);background:rgba(255,255,255,.04);color:var(--teks);font:inherit;font-size:14px}
.kelompok-judul{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 4px 2px;flex-wrap:wrap}.kelompok-judul b{font-size:15px}.kelompok-judul .samar{font-size:12.5px}
.baris-inv{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.04);border-left:3px solid transparent;text-decoration:none;color:inherit;align-items:center}.baris-inv:hover{background:rgba(255,255,255,.08)}.baris-inv.belum{border-left-color:var(--merah)}.baris-inv.lunas{border-left-color:var(--hijau)}.baris-inv .bi-kiri{display:flex;flex-direction:column;gap:3px;min-width:0}.baris-inv .bi-kiri .samar{font-size:12px}.baris-inv .bi-kanan{display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}
@media (max-width:600px){.baris-inv{flex-direction:column;align-items:stretch}.baris-inv .bi-kanan{flex-direction:row;justify-content:space-between;align-items:center}}
.tab-baris{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab-baris::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--garis2);background:transparent;border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--redup);white-space:nowrap}
.tab.aktif{background:var(--teks);color:#0a1511;border-color:var(--teks)}
.tbl-bungkus{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--samar);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--garis2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--garis);vertical-align:top}
tr:last-child td{border-bottom:0}
.angka{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--garis2)}
.kosong{padding:26px;text-align:center;color:var(--redup)}

/* pahlawan */
.pahlawan{padding:30px 0 6px;text-align:center}
.pahlawan .pil-hijau{font-size:12px;padding:5px 13px}
.pahlawan h1{font-family:var(--sans);font-weight:700;font-size:clamp(40px,8vw,76px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 6px}
.pahlawan h1 .miring{font-weight:400;letter-spacing:-.01em}
.pahlawan .sub{color:var(--redup);font-size:16px;max-width:560px;margin:0 auto}
.pahlawan .aksi{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.tombol{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:12px 20px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--garis2);background:rgba(255,255,255,.03)}
.tombol.utama{background:var(--hijau);color:#06140d;border-color:var(--hijau);box-shadow:0 8px 30px rgba(95,208,143,.25)}
.tombol:hover{filter:brightness(1.07)}
.fitur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.fitur > div{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r2);background:rgba(255,255,255,.025);border:1px solid var(--garis)}
.fitur .ik{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hijau-bg);color:var(--hijau)}
.fitur b{display:block;font-size:14.5px;line-height:1.25}
.fitur small{color:var(--redup);font-size:12px}
@media (max-width:860px){ .fitur{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ubin angka */
.ubin .nilai{font-family:var(--serif);font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.ubin .nilai.kecil{font-size:26px}
.ubin small{color:var(--redup);font-size:12.5px}

/* laporan laba rugi bertingkat */
.lr{display:flex;flex-direction:column}
.lr .b{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--garis2)}
.lr .b:last-child{border-bottom:0}
.lr .b.kurang span:first-child{padding-left:14px;color:var(--redup)}
.lr .b.jumlah{border-bottom:1px solid var(--garis2)}
.lr .b.jumlah span:first-child{font-weight:700}
.lr .b.besar{padding:14px 0}
.lr .b.besar span:last-child{font-family:var(--serif);font-size:30px;line-height:1}
.lr small{color:var(--samar);font-size:12px;margin-left:6px}

/* grafik */
.grafik svg{width:100%;height:auto;display:block}
.grafik text{fill:var(--samar);font:12px var(--sans)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--redup);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* baris daftar */
.daftar > div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--garis);align-items:center}
.daftar > div:last-child{border-bottom:0}
.daftar b{font-weight:600}
.batang{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
.batang i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hijau2),var(--hijau))}

.catatan-ai{position:relative;padding:20px 22px;border-radius:var(--r);background:linear-gradient(135deg,rgba(95,208,143,.10),rgba(95,208,143,.02) 60%);border:1px solid rgba(95,208,143,.2)}
.catatan-ai p{margin:8px 0 0;font-size:15.5px;line-height:1.65}

/* masuk */
.masuk{min-height:100vh;display:grid;place-items:center;padding:30px 18px}
.masuk .kotak{width:100%;max-width:420px;text-align:center}
.masuk img{width:64px;height:64px;border-radius:50%}
.masuk h1{font-family:var(--sans);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.05;margin:18px 0 8px}
.masuk p{color:var(--redup);margin:0 0 24px}
.masuk form{display:flex;flex-direction:column;gap:10px;text-align:left}
.masuk input{width:100%;padding:14px 18px;border-radius:99px;border:1px solid var(--garis2);background:rgba(255,255,255,.04);color:var(--teks);font:inherit;font-size:16px}
.masuk input:focus{outline:none;border-color:var(--hijau)}
.masuk .tombol{justify-content:center;width:100%;font-size:15.5px}
.pesan-salah{color:var(--merah);font-size:13.5px;min-height:20px;text-align:center}
.kaki{margin-top:46px;padding:18px 0;border-top:1px solid var(--garis);color:var(--samar);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.memuat{padding:80px 0;text-align:center;color:var(--redup)}
/* formulir */
.isian{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--redup);font-weight:600}
.isian input,.isian select,.isian textarea,.sel input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--garis2);background:rgba(255,255,255,.04);color:var(--teks);font:inherit;font-size:14.5px;font-weight:500}
.isian select option{background:#0f1d17}
.isian input:focus,.isian select:focus,.sel input:focus{outline:none;border-color:var(--hijau)}
.sel input{padding:8px 9px;border-radius:9px;font-size:14px}
.sel input.angka{text-align:right}
table.ed td{padding:5px 4px;border-bottom:1px solid var(--garis)} table.ed th{padding:6px 4px}
.tombol.kecil{padding:8px 14px;font-size:13px}
/* operasional: kotak hadir per hari, pemilih pekan, pilihan jenis */
.pekan{display:flex;align-items:center;gap:10px;margin:16px 0 14px;flex-wrap:wrap}
.pekan b{font-size:17px;min-width:150px;text-align:center}
.hadir{width:36px;height:36px;border-radius:11px;border:1px solid var(--garis2);background:transparent;color:var(--samar);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.hadir.m{background:var(--hijau-bg);color:var(--hijau);border-color:rgba(95,208,143,.45)}
.hadir.s{background:var(--kunyit-bg);color:var(--kunyit);border-color:rgba(232,181,74,.45)}
.hadir.kini{box-shadow:0 0 0 2px rgba(127,180,234,.55)}
table.absen th,table.absen td{text-align:center;padding:6px 3px;vertical-align:middle}
table.absen th:first-child,table.absen td:first-child{text-align:left;padding-left:0;min-width:110px}
table.absen .hp-baris{display:none}
table.gaji-harian tr.hari-ini td{background:rgba(95,208,143,.07)} table.gaji-harian td{vertical-align:middle}
@media (max-width:560px){ .hadir{width:30px;height:32px;border-radius:9px;font-size:13px} table.absen th,table.absen td{padding:5px 2px} table.absen th:first-child,table.absen td:first-child{min-width:0;max-width:92px;overflow-wrap:anywhere} table.absen .laptop-saja{display:none} table.absen .hp-baris{display:table-row} table.absen tr:has(+ .hp-baris) td{border-bottom:0} }
.pilih{display:flex;gap:6px;flex-wrap:wrap}
.pilih .tab{cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:7px 13px}
.tombol.bahaya{color:var(--merah);border-color:rgba(240,130,111,.35)}
.baris-aksi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lembar{background:#fff;color:#111;border-radius:14px;padding:26px 28px;font:13px/1.45 'Plus Jakarta Sans',Arial,sans-serif;font-variant-numeric:tabular-nums;overflow-x:auto}
.lembar .kop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:10px}
.lembar .kop b{font-size:17px;letter-spacing:.01em}
.lembar h3{font-size:15px;letter-spacing:.14em;margin:14px 0 8px;font-weight:700}
.lembar table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.lembar th,.lembar td{border:1px solid #333;padding:5px 7px;color:#111}
.lembar th{background:#eef3ef;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.lembar .kanan{text-align:right;white-space:nowrap}
.lembar .ttd{display:flex;justify-content:space-between;margin-top:26px;text-align:center}
.lembar .ttd div{min-width:160px}
.lembar .ttd .garis-ttd{margin-top:54px;border-top:1px dotted #333;padding-top:4px}
.lembar .kecil{font-size:11.5px;color:#444}
.lembar.lembar-pdf{border-radius:0;padding:0;overflow:visible;width:760px} .lembar.lembar-pdf table{min-width:0}
/* lembar PDF selalu bertata letak laptop, juga saat dibuat di HP, supaya posisi potong halaman tepat */
.lembar.lembar-pdf .mitra-info{grid-template-columns:repeat(3,minmax(0,1fr))!important} .lembar.lembar-pdf .mitra-kop .kanan-kop{text-align:right!important}
/* lembar pemberitahuan fee mitra: sengaja berbeda dari nota dapur (pita kop gelap, kotak info, total di kotak kuning) */
.lembar .mitra-kop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;background:#0d2419;color:#f1e7cf;border-radius:12px;padding:16px 18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra-kop .jenis{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8fd9ae;font-weight:700}
.lembar .mitra-kop b{display:block;font-size:21px;color:#fff;margin-top:3px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:0}
.lembar .mitra-kop .kanan-kop{text-align:right;font-size:12px;color:#cfe3d6}
.lembar .mitra-kop .kanan-kop strong{display:block;font-size:14px;color:#fff;letter-spacing:.04em}
.lembar .mitra-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.lembar .mitra-info div{border:1px solid #d9e2dc;border-radius:10px;padding:9px 11px}
.lembar .mitra-info span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b7a71;margin-bottom:2px}
.lembar .mitra table th{background:#f6efdc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lembar .mitra table td,.lembar .mitra table th{border-color:#cdd6d0}

// ---------- grafik batang sederhana (satu skala untuk batang, garis bantu, dan label)
function grafikBatang(data, { tinggi = 210, seri = [{ k: 'v', warna: 'var(--hijau)' }], label = d => d.label, format = rpS } = {}) {
  if (!data.length) return '<div class="kosong">Belum ada data.</div>';
  const W = 640, kiri = 58, bawah = 26, atas = 12, H = tinggi;
  const maks = Math.max(1, ...data.flatMap(d => seri.map(s => d[s.k] || 0)));
  const langkah = (() => { const kasar = maks / 4, p = 10 ** Math.floor(Math.log10(kasar)), n = kasar / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const puncak = Math.ceil(maks / langkah) * langkah, y = v => atas + (H - atas - bawah) * (1 - v / puncak);
  const lebarGrup = (W - kiri - 8) / data.length, lb = Math.min(26, (lebarGrup - 12) / seri.length);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= puncak + 1; v += langkah) s += `<line x1="${kiri}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(190,230,205,.08)"/><text x="${kiri - 8}" y="${y(v) + 4}" text-anchor="end">${esc(format(v).replace('Rp ', ''))}</text>`;
  data.forEach((d, i) => {
    const x0 = kiri + i * lebarGrup + (lebarGrup - lb * seri.length - 4 * (seri.length - 1)) / 2;
    seri.forEach((sr, j) => { const v = Math.max(0, d[sr.k] || 0), yy = y(v); s += `<rect x="${x0 + j * (lb + 4)}" y="${yy}" width="${lb}" height="${Math.max(0, H - bawah - yy)}" rx="5" fill="${sr.warna}"><title>${esc(label(d))}: ${esc(rp(d[sr.k]))}</title></rect>`; });
    s += `${data.length <= 16 || i % 2 === 0 ? `<text x="${kiri + i * lebarGrup + lebarGrup / 2}" y="${H - 8}" text-anchor="middle">${esc(label(d))}</text>` : ''}`;
  });
  return `<div class="grafik" style="overflow-x:auto">${s}</svg></div>`;
}

// ---------- OPERASIONAL: absensi & gaji karyawan, pengeluaran kecil dengan keterkaitannya

// minggu 20 = Senin 21 Sep 2026, 7 kotak Senin..Minggu). Di sini hanya dibaca (mbg_gaji_nta) dan disusun ulang menjadi
// gaji per tanggal supaya hitungan pekan (Minggu..Sabtu), beranda, dan laba rugi tetap jalan.
const OFU_URL = 'https://minyak.markasku.my.id';
const SENIN20 = Date.UTC(2026, 8, 21);
function bangunKry(daftar) { const harian = {}, orang = [], pinjam = [];

    for (const w of k.nta || []) { const senin = SENIN20 + ((+w.w || 0) - 20) * 7 * 864e5;
      (w.hari || []).forEach((n, i) => { if (+n > 0) { const t = new Date(senin + i * 864e5).toISOString().slice(0, 10); (harian[t] ||= {})[k.kode] = +n; } }); }
    for (const d of k.hutang || []) { if (+d.pinjam > 0) pinjam.push({ id: k.kode + '|' + (d.tgl || '') + '|p', orang: k.kode, jenis: 'pinjam', jumlah: +d.pinjam, tgl: d.tgl || '', ket: d.ket || '' });
      if (+d.bayar > 0) pinjam.push({ id: k.kode + '|' + (d.tgl || '') + '|b', orang: k.kode, jenis: 'bayar', jumlah: +d.bayar, tgl: d.tgl || '', ket: d.ket || '' }); } }
  return { orang, absen: {}, harian, bayar: {}, manual: {}, pinjam }; }
const JENIS_KELUAR = ['Parkir', 'Bensin', 'Makan', 'Ongkos antar', 'Perlengkapan', 'Lainnya'];
const TERKAIT = [['belanja', 'Belanja barang'], ['antar', 'Antar ke dapur'], ['umum', 'Operasional umum'], ['pribadi', 'Pribadi']];

// Pekan gaji karyawan: Minggu sampai Sabtu (permintaan pemilik, 27 Sep 2026).
// Pencatatan gaji di aplikasi dimulai 27 Sep 2026 (permintaan pemilik); sebelum itu gaji ada di laporan Excel.
const mulaiGaji = () => KRY.mulai || '2026-09-27';
const awalPekanKry = t => { const d = tglD(t); d.setDate(d.getDate() - d.getDay()); return d.toLocaleDateString('sv-SE'); };
// Gaji satu orang dalam satu pekan: dihitung per hari (hadir = upah harian, setengah hari = separuh upah).
// Kalau pemilik mengetik gaji manual untuk pekan itu, angka manual yang dipakai.
// Gaji satu orang dalam satu pekan (Minggu-Sabtu) = jumlah gaji harian yang diketik per tanggal.
const gajiHari = (t, id) => +((KRY.harian || {})[t] || {})[id] || 0;
function gajiPekan(o, awal) {
  let m = 0, gaji = 0;
  for (let i = 0; i < 7; i++) { const n = gajiHari(tambahHari(awal, i), o.id); if (n > 0) { m++; gaji += n; } }
  return { o, m, s: 0, hitung: gaji, manual: null, gaji, jumlah: gaji, bayar: KRY.bayar[awal + '|' + o.id] || null };
}
// Sisa pinjaman: semua pinjaman dikurangi bayar tunai dan potongan gaji.
function sisaPinjam(id) {
  const P = (KRY.pinjam || []).filter(x => x.orang === id), pot = Object.entries(KRY.bayar).filter(([k]) => k.endsWith('|' + id)).reduce((a, [, b]) => a + (+b.potong || 0), 0);
  return P.filter(x => x.jenis === 'pinjam').reduce((a, x) => a + x.jumlah, 0) - P.filter(x => x.jenis === 'bayar').reduce((a, x) => a + x.jumlah, 0) - pot;
}
// Biaya di laporan Excel mingguan digolongkan dari keterangannya; gaji dipisah ke absensi.
function jenisDariKet(ket, kat) { const k = String(ket || '').toLowerCase();
  if (/gaji|upah(?! antar)/.test(k) || kat === 'Gaji & Upah') return 'gaji';
  return /parkir/.test(k) ? 'Parkir' : /bensin|bbm/.test(k) ? 'Bensin' : /makan|minum/.test(k) ? 'Makan' : /antar|ongkos/.test(k) ? 'Ongkos antar' : /kardus|alat|baut|perlengkapan/.test(k) ? 'Perlengkapan' : 'Lainnya'; }

  const minggu = tambahHari(senin, 6), out = [];
  for (const w of M) { if (w.sumber === 'aplikasi') continue;   // biaya minggu aplikasi sudah ada di KELUAR dan absensi, jangan dobel
    for (const b of w.biaya || []) if (b.tanggal >= senin && b.tanggal <= minggu) out.push({ ...b, jenis: jenisDariKet(b.ket, b.kategori) }); }

}
function keluarPekan(senin) {
  const minggu = tambahHari(senin, 6);
  const app = KELUAR.daftar.filter(x => x.tgl >= senin && x.tgl <= minggu).map(x => ({ ...x, sumber: 'app' }));

// ---------- STOK
// ---------- stok terkini = stok Excel + catatan aplikasi
let STOK = { gerak: [], ubah: {}, baru: [], lewat: [] };   // lewat = nama di invoice yang bukan barang stok (beli langsung dijual), 4 Okt 2026
const namaInti = n => kunciB(String(n || '').replace(/\s*\(.*\)\s*$/, ''));
// tanggal berkas stok Excel terakhir disimpan: catatan aplikasi sampai tanggal itu dianggap sudah ada di Excel
const patokanStok = () => ((D.sumber || []).find(x => /stok barang/i.test(x.berkas)) || {}).diubah?.slice(0, 10) || '0000-00-00';
// Barang keluar lewat invoice aplikasi. Nama di invoice sering lebih panjang dari nama di stok ("beras cap belalang"
// lawan "beras"), jadi pencocokannya bertingkat (3 Okt 2026): nama persis, nama inti (tanpa kurung), nama lain yang
// disimpan pemilik (alias, dipisah koma, di data barang stok), lalu awalan kata kalau hanya satu barang stok yang cocok.
// Satuan tetap harus sama. Yang tidak ketemu tampil di editor invoice dengan tombol "Hubungkan ke stok".
const aliasB = b => String(b.alias || '').split(',').map(kunciB).filter(Boolean);
// Satuan di invoice sering disingkat (btl, bks, rtng); disamakan dulu sebelum dibandingkan (4 Okt 2026).
const SAT_SAMA = { btl: 'botol', bks: 'bungkus', bgks: 'bungkus', bkus: 'bungkus', rtng: 'renteng', rtg: 'renteng', rteng: 'renteng', pc: 'pcs', buah: 'pcs', bh: 'pcs', biji: 'pcs', bj: 'pcs', ltr: 'liter', lt: 'liter', l: 'liter', krg: 'karung', dos: 'dus', box: 'dus', kln: 'kaleng', klg: 'kaleng', ikt: 'ikat', btr: 'butir', kilo: 'kg', kilogram: 'kg', gr: 'gram', g: 'gram', sct: 'sachet', saset: 'sachet', pak: 'pack', pk: 'pack', ek: 'ekor', ppn: 'papan', 'papan panjang': 'papan' };
const satuanKunci = s => { const k = kunciB(s).replace(/[.]+$/, ''); return SAT_SAMA[k] || k; };
const satuanCocok = (a, b) => !satuanKunci(a) || !satuanKunci(b) || satuanKunci(a) === satuanKunci(b);
// Kata dalam nama barang: isi kurung dibuang, ejaan umum disamakan (saus = saos, cabai = cabe), urutan tidak dipedulikan.
const KATA_SAMA = { saus: 'saos', saori: 'saos', sambel: 'sambal', cabai: 'cabe', telor: 'telur', bombai: 'bombay' };   // Saori = merek saos tiram/teriyaki
const kataNama = n => [...new Set(kunciB(n).replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').split(' ').filter(Boolean).map(w => KATA_SAMA[w] || w))];
const bukanStok = nama => (STOK.lewat || []).includes(kunciB(nama));
// Urutan pencocokan: nama lain yang dipilih pemilik (berlaku apa pun satuannya), lalu di antara barang bersatuan sama:
// nama persis, nama inti (tanpa kurung), nama invoice memuat semua kata nama stok ("beras cap belalang" untuk Beras,
// "saori saos tiram" untuk Saos Tiram), atau sebaliknya ("kaldu jamur" untuk Totole / Kaldu Jamur). Kalau calonnya lebih
// dari satu, tidak dipaksa; pemilik yang memilih lewat dialog hubungkan.
function cocokStok(daftar, nama, satuan) {
  const k = kunciB(nama); if (!k) return null;
  const alias = daftar.find(b => aliasB(b).includes(k)); if (alias) return alias;
  const S = daftar.filter(b => satuanCocok(satuan, b.satuan));
  const persis = S.find(b => kunciB(b.nama) === k) || S.find(b => namaInti(b.nama) === k); if (persis) return persis;
  const W = kataNama(nama); if (!W.length) return null; const satu = c => c.length === 1 ? c[0] : null;
  let c = S.map(b => ({ b, w: kataNama(namaInti(b.nama)) })).filter(x => x.w.length && x.w.every(w => W.includes(w)) && (x.w.length > 1 || x.w[0] === W[0]));   // satu kata harus kata pertama: "tepung beras" bukan Beras
  if (c.length) { const m = Math.max(...c.map(x => x.w.length)); return satu(c.filter(x => x.w.length === m).map(x => x.b)); }
  return satu(S.filter(b => { const w = kataNama(namaInti(b.nama)); return w.length && W.every(x => w.includes(x)); })); }
// Petunjuk di dialog hubungkan: barang stok yang berbagi kata (minimal 4 huruf) dengan nama invoice, paling banyak tiga. Hanya
// ditampilkan sebagai teks; pemilik yang memutuskan, supaya "tepung beras" tidak otomatis dianggap Tepung Terigu.
function saranStok(daftar, nama, satuan) {
  const W = kataNama(nama).filter(w => w.length >= 4); if (!W.length) return [];
  return daftar.map(b => { const w = kataNama(b.nama), n = w.filter(x => W.includes(x)).length; return { b, n, depan: W.includes(w[0]) || w.includes(W[0]), sat: satuanCocok(satuan, b.satuan) }; })   // kata pertama salah satunya ikut cocok
    .filter(x => x.n >= 2 || (x.n === 1 && x.depan)).sort((a, b) => (b.sat - a.sat) || (b.n - a.n)).slice(0, 3).map(x => x.b); }
// Semua nama di invoice yang belum terhubung ke stok dan belum ditandai bukan barang stok, digabung per nama + satuan.
function lepasInvoice(daftar, invoice = INVOICE) {
  const peta = {};
  for (const v of invoice) for (const x of hitungInv(v).b) { if (!(qtyMilik(x) > 0) || bukanStok(x.barang) || cocokStok(daftar, x.barang, x.satuan)) continue;
    const k = kunciB(x.barang) + '|' + satuanKunci(x.satuan), e = peta[k] ||= { barang: x.barang, satuan: x.satuan || '', modal: +x.modal || 0, qty: 0, nota: 0, terakhir: '' };
    e.qty += qtyMilik(x); e.nota++; if ((v.tanggal || '') > e.terakhir) e.terakhir = v.tanggal; if (+x.modal) e.modal = +x.modal; }
  return Object.values(peta).sort((a, b) => b.nota - a.nota || a.barang.localeCompare(b.barang)); }
function keluarInvoice(daftar) {
  const out = [];
  for (const v of INVOICE) for (const x of hitungInv(v).b.filter(x => qtyMilik(x) > 0)) {
    const b = cocokStok(daftar, x.barang, x.satuan);
    if (b) out.push({ id: 'inv:' + v.id + ':' + x.barang, kode: b.kode, jenis: 'keluar', jumlah: qtyMilik(x), tgl: v.tanggal, ket: `invoice ${judulOutlet(v.outlet)} nota ${nomorNota(v.nomor)}${qtyTitip(x) ? ' (tanpa titipan ' + angkaID(qtyTitip(x)) + ')' : ''}`, dibuat: v.dibuat || '', inv: v.id });
  }
  return out;
}
function stokKini() {
  const pat = patokanStok();
  const daftar = [...(D.stok ? D.stok.barang : []).map(b => ({ ...b, dariExcel: true })), ...STOK.baru.map(b => ({ ...b, awal: 0, masuk: 0, keluar: 0, stok: 0, dariExcel: false }))]
    .map(b => ({ ...b, ...(STOK.ubah[b.kode] || {}), riwayat: [], belanjaApp: false }));
  const peta = Object.fromEntries(daftar.map(b => [b.kode, b]));
  const gerak = [...STOK.gerak.map(x => ({ ...x, app: true })), ...keluarInvoice(daftar)]
    .filter(x => peta[x.kode] && (!peta[x.kode].dariExcel || x.tgl > pat))
    .sort((a, b) => a.tgl.localeCompare(b.tgl) || (a.dibuat || '').localeCompare(b.dibuat || ''));
  for (const x of gerak) { const b = peta[x.kode];
    if (x.jenis === 'beli') { b.stok += x.jumlah; if (x.harga) { b.harga = x.harga; b.belanjaApp = true; } }
    else if (x.jenis === 'keluar') b.stok -= x.jumlah;
    else if (x.jenis === 'set') b.stok = x.jumlah;
    b.riwayat.push(x); }
  for (const b of daftar) { b.stok = Math.round(b.stok * 1000) / 1000; b.status = b.stok <= 0 ? 'HABIS' : b.stok <= (+b.minimum || 0) ? 'MENIPIS' : 'AMAN'; b.nilai = Math.round(Math.max(0, b.stok) * (+b.harga || 0)); }
  return { barang: daftar, gerak, patokan: pat, nilai: daftar.reduce((a, b) => a + b.nilai, 0), habis: daftar.filter(b => b.status === 'HABIS').length, menipis: daftar.filter(b => b.status === 'MENIPIS').length };

const namaTtd = () => (semuaRek().find(r => r.usaha === (D.profil || {}).rekeningBawaan) || {}).atasNama || '................................';
const kunciB = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const angkaID = n => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const nomorNota = n => String(Math.max(0, +n || 0)).padStart(3, '0');
function pesan(t, salah) {

  e.textContent = t; e.style.cssText = `position:fixed;left:50%;bottom:${innerWidth <= 860 ? 96 : 24}px;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);background:${salah ? 'var(--merah)' : 'var(--hijau)'};color:#07140d`;

function terbilang(n) {
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10) : x < 200 ? 'seratus ' + f(x - 100)
    : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100) : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000)
    : x < 1e9 ? f(Math.floor(x / 1e6)) + ' juta ' + f(x % 1e6) : f(Math.floor(x / 1e9)) + ' miliar ' + f(x % 1e9);
  const t = (f(Math.floor(Math.abs(n || 0))).replace(/\s+/g, ' ').trim() || 'nol') + ' rupiah';
  return t.charAt(0).toUpperCase() + t.slice(1);
}
// Dapur untuk invoice: kop dari berkas nota, nomor terakhir dari berkas nota, laporan mingguan, dan invoice aplikasi.
function daftarDapur() {
  const peta = {};
  for (const d of D.dapur || []) peta[d.outlet] = { ...d };
  for (const d of DAPUR_T) peta[d.outlet] ||= { outlet: d.outlet, toko: d.toko, alamat: d.alamat || '', notaTerakhir: 0, tanggalTerakhir: d.dibuat, aktif: true, tambahan: true };
  for (const w of M) for (const r of w.rincian) {
    const n = +((String(r.n || '').match(/(\d+)/) || [])[1] || 0); if (!n || n > 99999) continue;
    const d = peta[r.o] ||= { outlet: r.o, toko: r.o, alamat: '', notaTerakhir: 0, tanggalTerakhir: r.t, aktif: true };
    if (n > d.notaTerakhir) d.notaTerakhir = n; if (r.t && (!d.tanggalTerakhir || r.t > d.tanggalTerakhir)) d.tanggalTerakhir = r.t;
  }
  for (const v of INVOICE) { const d = peta[v.outlet]; if (d && +v.nomor > d.notaTerakhir) d.notaTerakhir = +v.nomor; }
  return Object.values(peta).sort((a, b) => (b.aktif !== false) - (a.aktif !== false) || (b.tanggalTerakhir || '').localeCompare(a.tanggalTerakhir || ''));
}
// Harga, satuan, modal, dan fee terakhir sebuah barang untuk dapur tertentu.
function infoBarang(outlet, barang) {
  const k = kunciB(barang); if (!k) return null;
  const kat = (D.katalog || []).filter(x => kunciB(x.barang) === k).sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
  const diDapur = kat.find(x => x.outlet === outlet), umum = kat[0];
  let modal = 0, fee = null, lap = null;
  for (const w of M) for (const r of w.rincian) if (kunciB(r.b) === k) { if (r.m) modal = r.m; if (r.o === outlet) { fee = r.f; lap = r; } }
  const tarif = (TARIF[outlet] || {})[k];
  const sb = barangStok(barang); const satInv = (diDapur || umum || lap || {}).satuan || (lap || {}).s || '';
  if (sb && sb.belanjaApp && (!satInv || kunciB(satInv) === kunciB(sb.satuan))) modal = sb.harga;
  const dariLap = lap && (!diDapur || (lap.t || '') >= (diDapur.tanggal || ''));
  return { satuan: (dariLap ? lap.s : (diDapur || umum || {}).satuan) || (umum || {}).satuan || '', harga: dariLap ? lap.h : (diDapur || umum || {}).harga || 0,
    modal, fee: OUTLET_FEE.includes(outlet) ? (tarif ?? fee ?? 0) : 0 };
}
function namaBarang(outlet) {
  const lihat = new Map();
  const tambah = n => { const k = kunciB(n); if (k && !lihat.has(k)) lihat.set(k, String(n).trim()); };
  (D.katalog || []).filter(x => x.outlet === outlet).forEach(x => tambah(x.barang));
  for (const w of M.slice().reverse()) w.rincian.filter(r => r.o === outlet).forEach(r => tambah(r.b));
  (D.katalog || []).forEach(x => tambah(x.barang)); for (const w of M) w.rincian.forEach(r => tambah(r.b));
  return [...lihat.values()].slice(0, 500);

    const k = kunciB(r.barang) + '|' + r.fee + '|' + kunciB(r.satuan) + '|' + (r.harga || 0) + (r.titip ? '|titip' : '');
    const bh = hr.barang[k] ||= { barang: r.barang, satuan: r.satuan, fee: r.fee, harga: r.harga || 0, qty: 0, titip: !!r.titip };
    const nJual = r.qty * (r.harga || 0);

  for (const w of M) for (const r of w.rincian) if (OUTLET_FEE.includes(r.o)) { const k = kunciB(r.b); (riwayat[r.o] ||= {})[k] = { barang: r.b, satuan: r.s, fee: r.f, tanggal: r.t }; }
  const ubah = JSON.parse(JSON.stringify(TARIF || {}));
  el.innerHTML = `
  <section class="bagian" style="margin-top:6px">
    <a href="#invoice" class="pil" style="text-decoration:none">← Invoice</a>
    <h2 style="margin-top:14px">Tarif <span class="miring">fee</span></h2>
    <p class="ket">Fee per satuan tiap barang untuk ${esc(daftarFee())}. Di invoice, tarif ini tampil sebagai petunjuk di kolom fee dan bisa diisikan sekaligus lewat tombol Pakai tarif fee. Angka awal diambil dari laporan mingguan terakhir. Laporan mingguan di Excel tetap memakai ketikanmu sendiri.</p>
    <div class="grid g2">${OUTLET_FEE.map(o => { const R = Object.entries(riwayat[o] || {}).sort((a, b) => a[1].barang.localeCompare(b[1].barang));
      return `<div class="kartu"><b style="font-size:17px">${esc(judulOutlet(o))}</b><div class="samar" style="font-size:12px">${R.length} barang pernah dikirim</div>
        <div class="tbl-bungkus" style="margin-top:8px;max-height:460px;overflow-y:auto"><table class="ed"><thead><tr><th>Barang</th><th>Satuan</th><th class="angka">Fee/sat</th></tr></thead>
        <tbody>${R.map(([k, x]) => { const t = (ubah[o] || {})[k]; return `<tr><td>${esc(x.barang)}</td><td class="redup">${esc(x.satuan)}</td><td class="sel"><input type="number" class="angka" step="any" inputmode="decimal" data-o="${esc(o)}" data-k="${esc(k)}" value="${esc(t ?? x.fee ?? 0)}" style="width:100px"></td></tr>`; }).join('') || '<tr><td colspan="3" class="kosong">Belum ada riwayat.</td></tr>'}</tbody></table></div></div>`; }).join('')}</div>
    <div class="baris-aksi aksi-lekat" style="margin-top:14px"><button class="tombol utama" id="bSimpanTarif">Simpan tarif</button></div>
  </section>`;
  $$('input[data-o]', el).forEach(i => i.oninput = () => { (ubah[i.dataset.o] ||= {})[i.dataset.k] = +i.value || 0; });
  $('#bSimpanTarif', el).onclick = async () => { try { const r = await rpc('mbg_simpan_nilai', { p_token: sesi.baca().token, p_kunci: 'tarif-fee', p_nilai: ubah });
    if (!r.ok) return pesan(r.pesan || 'Gagal menyimpan.', true); TARIF = ubah; pesan('Tarif fee tersimpan'); } catch (er) { pesan(er.message, true); } };
}

// ---------- LAINNYA (HP)
function vLainnya(el) {
  const L = [['ringkasan', 'Ringkasan', 'ringkas', 'Laporan minggu terakhir dan hal yang perlu dilihat'], ['mingguan', 'Laba rugi', 'minggu', 'Laba kotor dan laba bersih tiap minggu laporan'], ['fee/tarif', 'Tarif fee', 'fee', 'Fee per satuan tiap barang untuk empat dapur fee'], ['stok', 'Stok', 'stok', 'Barang habis, menipis, dan nilai gudang'], ['piutang', 'Piutang', 'piutang', 'Tagihan dapur yang belum dibayar'], ['neraca', 'Neraca', 'neraca', 'Laba rugi bulanan dan posisi harta'], ['kabar', 'Catatan pembaruan', 'kabar', 'Kapan terakhir diperbarui dari laptop']];
  el.innerHTML = `<section class="bagian" style="margin-top:6px"><h2>Lainnya</h2><div class="grid g2">${sudahTerpasang() ? '' : `<button class="kartu" id="kPasang" style="text-align:left;display:flex;gap:14px;align-items:center;font:inherit;color:inherit;cursor:pointer"><span class="ik" style="flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--hijau-bg);color:var(--hijau)">${ik('unduh', 20)}</span><span><b>Pasang di HP</b><div class="redup" style="font-size:13px">Jadikan aplikasi dengan ikon sendiri di layar utama</div></span></button>`}${L.map(x => `<a class="kartu" href="#${x[0]}" style="text-decoration:none;display:flex;gap:14px;align-items:center"><span class="ik" style="flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--hijau-bg);color:var(--hijau)">${ik(x[2], 20)}</span><span><b>${esc(x[1])}</b><div class="redup" style="font-size:13px">${esc(x[3])}</div></span></a>`).join('')}</div></section>`;
  if ($('#kPasang', el)) $('#kPasang', el).onclick = pasangAplikasi;
}

  const R = PEMBARUAN && PEMBARUAN.ringkasan;
  el.innerHTML = `
  <section class="bagian" style="margin-top:6px">
    <h2>Catatan <span class="miring">pembaruan</span></h2>
    <p class="ket">Laptop membaca laporan Excel setiap kali berkas disimpan, lalu mengirim angkanya ke sini.</p>
    ${CATATAN && CATATAN.teks ? `<div class="catatan-ai"><span class="label">Catatan pembukuan · ${esc(kapan(CATATAN.waktu))}</span><p>${esc(CATATAN.teks)}</p></div>` : ''}
    <div class="kartu" style="margin-top:14px"><div class="daftar">
      <div><span class="redup">Pembaruan terakhir</span><b>${esc(kapan(PEMBARUAN && PEMBARUAN.waktu))}</b></div>
      ${PEMBARUAN && PEMBARUAN.galat ? `<div><span class="redup">Masalah</span><span class="merah">Pembaruan terakhir gagal. Laptop akan mencoba lagi dalam 10 menit.</span></div>` : ''}
      <div><span class="redup">Laporan yang ikut berubah</span><span style="text-align:right">${esc(((PEMBARUAN && PEMBARUAN.berkasBerubah) || []).map(b => b.split('/').pop().replace(/\.xlsx$/i, '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase())).join(', ') || '-')}</span></div>
      ${R && R.perluDicek && R.perluDicek.selisihOmzetHarian.length ? `<div><span class="redup">Beda dengan omzet harian</span><span>${R.perluDicek.selisihOmzetHarian.length} baris</span></div>` : ''}
    </div></div>
  </section>`;
}

// ---------- MASUK
function layarMasuk(pesan) {
  // Sengaja tanpa nama usaha atau keterangan: siapa pun yang membuka alamat ini hanya melihat kotak sandi.
  document.title = 'NTA';
  akar.innerHTML = `<div class="masuk"><div class="kotak muncul">
    <img src="ikon-any-192.png?v=1" alt="">
    <h1>Masuk</h1>
    <p>Aplikasi pribadi.</p>
    <form id="fMasuk"><input id="iSandi" type="password" autocomplete="current-password" placeholder="Sandi" aria-label="Sandi" required>
      <button class="tombol utama" type="submit">Masuk ${ik('panah', 16)}</button>
      <div class="pesan-salah" id="pSalah">${esc(pesan || '')}</div></form>
  </div></div>`;
  $('#fMasuk').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true; $('#pSalah').textContent = '';
    try { const r = await rpc('mbg_masuk', { p_sandi: $('#iSandi').value });
      if (!r.ok) { $('#pSalah').textContent = r.pesan || 'Sandi salah.'; b.disabled = false; return; }
      sesi.simpan({ token: r.token, masuk: new Date().toISOString() }); akar.innerHTML = '<div class="memuat">Memuat…</div>'; await muat();
    } catch (er) { $('#pSalah').textContent = er.message; b.disabled = false; }
  };
  setTimeout(() => { const i = $('#iSandi'); if (i) i.focus(); }, 60);
}

muat().catch(e => { akar.innerHTML = `<div class="masuk"><div class="kotak"><h1>Belum tersambung</h1><p>${esc(e.message)}</p><button class="tombol utama" onclick="location.reload()">Coba lagi</button></div></div>`; });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
